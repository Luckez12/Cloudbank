name: Apply Cloudbank ZIP Patch

on:
  push:
    branches: [main]
    paths: ['**/*.zip']
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'Repository-relative ZIP path (optional when only one ZIP exists)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cloudbank-main-writes
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[zip-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply one ZIP patch
        id: patch
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: python3 scripts/apply_zip_patch.py --zip-file "$ZIP_FILE"
      - name: Validate patched repository
        if: steps.patch.outputs.found == 'true'
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm test
      - name: Commit verified patch
        if: steps.patch.outputs.found == 'true'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: apply Cloudbank ZIP patch [zip-applied]'
          git push origin HEAD:main
