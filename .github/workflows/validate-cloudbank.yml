name: Validate Cloudbank

on:
  workflow_run:
    workflows: ["Apply Cloudbank ZIP Patch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbank-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Validate Nuvio provider repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run validate
          npm test
          
